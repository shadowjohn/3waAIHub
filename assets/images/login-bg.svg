<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"
     preserveAspectRatio="xMidYMid slice" width="1600" height="1000" aria-hidden="true">
  <defs>
    <!-- cool light wash -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#F6FAFE"/>
      <stop offset=".45" stop-color="#EAF2FC"/>
      <stop offset="1"   stop-color="#E1F0F7"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity=".34"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#818CF8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <!-- 格點：間距 48（較原本 32 放大 50%） -->
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#3B82F6" fill-opacity=".22"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1600" height="1000" fill="url(#fade)"/></mask>
  </defs>

  <!-- base -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#dots)" mask="url(#fadeMask)"/>

  <!-- ambient glows -->
  <ellipse cx="1400" cy="230" rx="520" ry="440" fill="url(#glowBlue)"/>
  <ellipse cx="240"  cy="880" rx="480" ry="380" fill="url(#glowCyan)"/>
  <ellipse cx="820"  cy="120" rx="420" ry="300" fill="url(#glowIndigo)"/>

  <!-- particles -->
  <g fill="#2563EB" fill-opacity=".30">
    <circle cx="520" cy="180" r="3"/><circle cx="600" cy="300" r="2.2"/><circle cx="430" cy="420" r="2.6"/>
    <circle cx="880" cy="240" r="2.4"/><circle cx="960" cy="640" r="3"/><circle cx="760" cy="560" r="2.2"/>
    <circle cx="1420" cy="820" r="2.8"/><circle cx="1520" cy="180" r="2.4"/><circle cx="300" cy="120" r="2.6"/>
    <circle cx="1080" cy="900" r="2.2"/><circle cx="180" cy="620" r="2.4"/><circle cx="1340" cy="60" r="2.6"/>
  </g>
</svg>
