# 由 Marketplace 產生的 runtime-settings.conf 才是實際服務設定。
# 此範本不含金鑰，且不得改名回 .env。
PALIGEMMA2_MODEL=google/paligemma2-3b-pt-224
PALIGEMMA2_MODEL_REVISION=96eeb174da13ca1a2b247e4d0867436296c36420
# 請在 Marketplace 的 Service Settings 寫入 HF_TOKEN；禁止建立 .env。
HF_TOKEN=
PALIGEMMA2_DEVICE=cuda
PALIGEMMA2_TORCH_DTYPE=float16
PALIGEMMA2_REAL_INFERENCE=0
PALIGEMMA2_MAX_NEW_TOKENS=64
PALIGEMMA2_MODEL_DIR=/models/paligemma2
PALIGEMMA2_CACHE_DIR=/cache/paligemma2
PALIGEMMA2_SERVICE_DATA_DIR=/data/service
PALIGEMMA2_LOCAL_PORT=18105
GPU_VISIBLE_DEVICES=all
